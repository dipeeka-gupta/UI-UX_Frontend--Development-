<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Log in to your DroneTV learning dashboard."><title>Log in | DroneTV</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/script.js" defer></script></head>
<body class="auth-page"><header class="site-header"><a class="brand" href="index.html" aria-label="DroneTV home"><span class="brand-mark">D</span><span>DroneTV</span></a><a class="back-link" href="index.html">← Back home</a></header><main class="auth-layout"><div class="auth-art image-frame reveal"><div><p class="eyebrow">Welcome back</p><h1>Keep your<br><em>eyes open.</em></h1></div><span class="auth-art-caption">Your next perspective<br>starts here.</span></div><section class="auth-panel reveal"><p class="eyebrow">Member login</p><h2>Good to see<br>you again.</h2><p class="auth-intro">Log in to pick up where you left off.</p><form class="login-form" data-login-form novalidate><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required><span class="field-error" data-error="email"></span></div><div class="field"><label for="password">Password</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" minlength="6" required><button type="button" class="password-toggle" data-password-toggle aria-label="Show password">Show</button></div><span class="field-error" data-error="password"></span></div><div class="form-options"><label class="checkbox-label"><input type="checkbox" name="remember"><span>Remember me</span></label><a href="login.html">Forgot password?</a></div><button class="button button-primary form-submit" type="submit">Log in <span>↗</span></button><p class="form-status" data-form-status role="status"></p></form><p class="auth-switch">New to DroneTV? <a href="courses.html">Explore courses</a></p></section></main></body></html>
